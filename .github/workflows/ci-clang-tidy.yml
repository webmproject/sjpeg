name: CI Clang-Tidy
on: [push, pull_request]

permissions:
  contents: read

# Cancel the workflow if a new one is triggered from the same PR, branch, or tag, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opts:
          - '-DSJPEG_HAVE_AVX2=ON'
          - '-DSJPEG_ENABLE_MULTITHREADING=OFF'
          - '-DSJPEG_ENABLE_PROGRESSIVE=OFF'
          - '-DSJPEG_ENABLE_SIMD=OFF'
          - >-
            -DSJPEG_ENABLE_RISKINESS=OFF -DSJPEG_ENABLE_SHARP_YUV=OFF
            -DSJPEG_ENABLE_SEARCH=OFF -DSJPEG_ENABLE_ADAPTIVE_QUANT=OFF
            -DSJPEG_ENABLE_METADATA=OFF -DSJPEG_ENABLE_C_FALLBACK=OFF
          - >-
            -DSJPEG_ENABLE_RISKINESS=OFF -DSJPEG_ENABLE_SHARP_YUV=OFF
            -DSJPEG_ENABLE_SEARCH=OFF -DSJPEG_ENABLE_ADAPTIVE_QUANT=OFF
            -DSJPEG_ENABLE_METADATA=OFF -DSJPEG_ENABLE_C_FALLBACK=OFF
            -DSJPEG_ENABLE_PROGRESSIVE=OFF -DSJPEG_ENABLE_MULTITHREADING=OFF
          - '-DCMAKE_CXX_FLAGS=-fno-exceptions -DSJPEG_HAVE_AVX2=ON'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang clang-tidy freeglut3-dev libjpeg-dev libpng-dev
      - run: >-
          cmake -B build
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ${{ matrix.opts }}
      - run: run-clang-tidy -p build -warnings-as-errors=* -quiet
      - run: >-
          clang-tidy -p build --warnings-as-errors=* --quiet
          src/*.h examples/*.h
